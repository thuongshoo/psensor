name: 'Setup Build Environment'
description: 'Set up build environment for specific Linux distribution'

inputs:
  distro:
    description: 'Distribution name (ubuntu, debian, fedora)'
    required: true
    default: 'ubuntu'
  distro-version:
    description: 'Distribution version'
    required: true
    default: '24.04'
  architecture:
    description: 'Target architecture'
    required: true
    default: 'amd64'

runs:
  using: composite
  steps:
    - name: Setup for ${{ inputs.distro }} ${{ inputs.distro-version }}
      shell: bash
      run: |
        case "${{ inputs.distro }}" in
          ubuntu|debian)
            sudo apt-get update
            sudo apt-get install -y build-essential cmake gettext help2man \
              libappindicator3-dev libatasmart-dev libcairo2-dev \
              libcurl4-openssl-dev libglib2.0-dev libgtk-3-dev \
              libgtop2-dev libjson-c-dev libmicrohttpd-dev \
              libnotify-dev libsensors-dev libudisks2-dev \
              libx11-dev libxnvctrl-dev pkg-config dpkg-dev
            ;;
          fedora)
            sudo dnf install -y gcc-c++ cmake gettext help2man \
              libappindicator3-devel libatasmart-devel cairo-devel \
              libcurl-devel glib2-devel gtk3-devel \
              libgtop2-devel json-c-devel libmicrohttpd-devel \
              libnotify-devel lm_sensors-devel udisks2-devel \
              libX11-devel libxnvctrl-devel pkg-config rpm-build
            ;;
          *)
            echo "Unsupported distribution: ${{ inputs.distro }}"
            exit 1
            ;;
        esac