name: "Package as DEB"
description: "Create Debian package from built binaries"

inputs:
  distro:
    description: "Distribution name"
    required: true
  distro_version:
    description: "Distribution version"
    required: true
  architecture:
    description: "Target architecture"
    required: true
  version:
    description: "Package version"
    required: true

outputs:
  package-file:
    description: "Generated .deb package filename"
    value: ${{ steps.package.outputs.package-file }}

runs:
  using: composite
  steps:
    - name: Create Debian package structure
      shell: bash
      run: |
        echo "📦 Creating Debian package structure..."
        rm -rf pkg_debian
        mkdir -p pkg_debian/DEBIAN
        mkdir -p pkg_debian/usr
        
        # Cài đặt vào thư mục package
        cd build
        make DESTDIR=../pkg_debian install
        cd ..

    - name: Generate control file
      shell: bash
      run: |
        echo "📝 Generating DEBIAN/control file..."
        
        # Tạo control file với các dependencies thích hợp
        cat > pkg_debian/DEBIAN/control <<EOF
        Package: psensor-fork
        Version: ${{ inputs.version }}
        Section: utils
        Priority: optional
        Architecture: ${{ inputs.architecture }}
        Maintainer: ${{ github.actor }} <${{ github.actor }}@users.noreply.github.com>
        Depends: libappindicator3-1 (>= 0.2.92), libatasmart4 (>= 0.13), libc6 (>= 2.38), libcairo2 (>= 1.2.4), libcurl4t64 (>= 7.16.2), libglib2.0-0t64 (>= 2.30.0), libgtk-3-0t64 (>= 3.21.5), libgtop-2.0-11 (>= 2.22.3), libjson-c5 (>= 0.15), libmicrohttpd12t64 (>= 0.9.50), libnotify4 (>= 0.7.0), libsensors5 (>= 1:3.5.0), libudisks2-0 (>= 2.0.0), libx11-6, libxnvctrl0, dconf-gsettings-backend | gsettings-backend
        Description: Graphical hardware temperature monitor for Linux.
         Psensor is a graphical hardware temperature monitor for Linux.
         This is a fork maintained by ${{ github.actor }}.
         It can display temperature, fan speed, and CPU usage.
        EOF

    - name: Build .deb package
      id: package
      shell: bash
      run: |
        PACKAGE_NAME="psensor-fork_${{ inputs.version }}_${{ inputs.distro }}${{ inputs.distro_version }}_${{ inputs.architecture }}.deb"
        echo "🏗️ Building package: $PACKAGE_NAME"
        
        # Build gói .deb
        dpkg-deb --build pkg_debian "$PACKAGE_NAME"
        
        # Kiểm tra file đã tạo
        if [ -f "$PACKAGE_NAME" ]; then
          echo "✅ Package created: $PACKAGE_NAME"
          echo "package-file=$PACKAGE_NAME" >> $GITHUB_OUTPUT
        else
          echo "❌ Failed to create package"
          exit 1
        fi