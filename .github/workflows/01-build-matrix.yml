name: 01. Build Packages

on:
  push:
    tags: ['v*']  # TỰ ĐỘNG khi có tag mới

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false  # Không dừng cả matrix nếu 1 job lỗi
      matrix:
        include:
          - name: "Ubuntu 24.04 amd64"
            distro: ubuntu
            distro_version: "24.04"
            arch: amd64
            package_type: deb
            
          - name: "Ubuntu 24.04 arm64"
            distro: ubuntu
            distro_version: "24.04"
            arch: arm64
            package_type: deb
            needs_qemu: true
            
          - name: "Debian 12 amd64"
            distro: debian
            distro_version: "12"
            arch: amd64
            package_type: deb

    outputs:
      artifacts_json: ${{ steps.generate-artifacts.outputs.artifacts-json }}      

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup QEMU for ARM64
        if: matrix.needs_qemu == true
        uses: docker/setup-qemu-action@v3
      
      - name: Common Setup
        uses: ./.github/actions/common/setup
        with:
          architecture: ${{ matrix.arch }}
          distro: ${{ matrix.distro }}
      
      - name: Setup Build Environment
        uses: ./.github/actions/build/setup-env
        with:
          distro: ${{ matrix.distro }}
          distro_version: ${{ matrix.distro_version }}
      
      - name: Compile psensor
        uses: ./.github/actions/build/compile
        with:
          architecture: ${{ matrix.arch }}
      
      - name: Extract clean version
        id: extract_version
        run: |
          # Lấy version từ tag và bỏ 'v' nếu có
          if [[ "${{ github.ref_name }}" == v* ]]; then
            CLEAN_VERSION="${GITHUB_REF_NAME#v}"
          else
            CLEAN_VERSION="${{ github.ref_name }}"
          fi
          echo "clean_version=$CLEAN_VERSION" >> $GITHUB_OUTPUT
      
      - name: Package as DEB
        uses: ./.github/actions/build/package-deb
        id: package
        with:
          distro: ${{ matrix.distro }}
          distro_version: ${{ matrix.distro_version }}
          architecture: ${{ matrix.arch }}
          version: ${{ steps.extract_version.outputs.clean_version }}
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: psensor-fork-${{ matrix.distro }}-${{ matrix.distro_version }}-${{ matrix.arch }}
          path: ${{ steps.package.outputs.package-file }}
          retention-days: 7

      - name: Generate artifacts list
        run: |
          ARTIFACTS_JSON=$(jq -n -c \
            --arg name "psensor-fork-${{ matrix.distro }}-${{ matrix.distro_version }}-${{ matrix.arch }}" \
            '[$name]')
          echo "artifacts-json=$ARTIFACTS_JSON" >> $GITHUB_OUTPUT