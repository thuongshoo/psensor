name: 02. Test Packages
on:
  workflow_run:
    workflows: ['01. Build Packages']
    types: [completed]

jobs:
  test:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Get workflow run job outputs via API
        id: get-outputs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Lấy danh sách jobs trong workflow run
          JOBS_JSON=$(gh api repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}/jobs)
          
          # 2. Tìm job 'build' và lấy outputs (giả sử job tên là 'build')
          # Cấu trúc JSON phức tạp, cần parse cẩn thận
          # Đây là logic đơn giản, có thể cần điều chỉnh
          ARTIFACTS_JSON=$(echo "$JOBS_JSON" | jq -r '.jobs[] | select(.name == "build") | .outputs.artifacts_json // "[]"')
          
          # 3. Đặt output cho step này
          echo "artifacts_json=$ARTIFACTS_JSON" >> $GITHUB_OUTPUT
          echo "Fetched artifacts: $ARTIFACTS_JSON"

      - name: Setup test matrix
        id: matrix-setup
        run: |
          # Tạo biến môi trường cho strategy (cách này đơn giản hơn dùng matrix phức tạp)
          ARTIFACTS="${{ steps.get-outputs.outputs.artifacts_json }}"
          echo "ARTIFACTS_JSON=$ARTIFACTS" >> $GITHUB_ENV
      - name: Debug - Show artifact info
        run: |
          echo "Artifact to test: ${{ matrix.artifact }}"
          echo "Workflow run ID: ${{ github.event.workflow_run.id }}"

      - name: Get artifacts via API
        id: get-artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Lấy danh sách artifacts từ workflow run
          ARTIFACTS=$(gh api repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}/artifacts)
          echo "artifacts=$ARTIFACTS" >> $GITHUB_OUTPUT

      - name: Download Specific Artifact
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id }}
          name: ${{ matrix.artifact }}
      
      - name: Parse Artifact Info
        id: info
        run: |
          # Tách tên artifact thành các thành phần
          IFS='-' read -r distro distro_version arch <<< "${{ matrix.artifact }}"
          echo "distro=${distro}" >> $GITHUB_OUTPUT
          echo "distro_version=${distro_version}" >> $GITHUB_OUTPUT
          echo "arch=${arch}" >> $GITHUB_OUTPUT
      
      - uses: ./.github/actions/test-basic
        with:
          package-file: '*.deb'
          distro: ${{ steps.info.outputs.distro }}
          distro-version: ${{ steps.info.outputs.distro_version }}
          architecture: ${{ steps.info.outputs.arch }}
      
      - name: Create Test Result Manifest
        if: success()  # Chỉ chạy nếu tất cả các bước test trước đều passed
        run: |
          # Tạo file JSON chứa thông tin package đã test thành công
          TEST_RESULT=$(jq -n \
            --arg pkg_name "$PACKAGE_NAME" \
            --arg distro "$DISTRO" \
            --arg arch "$ARCH" \
            --arg version "$VERSION" \
            --arg status "PASSED" \
            --arg workflow_run "${{ github.run_id }}" \
            '{package: $pkg_name, distro: $distro, arch: $arch, version: $version, status: $status, tested_in_run: $workflow_run}')
          
          echo "$TEST_RESULT" > test-result-manifest.json
          echo "✅ Test result saved for $PACKAGE_NAME"
        env:
          PACKAGE_NAME: ${{ steps.download.outputs.package-name }}
          DISTRO: ${{ matrix.distro }}
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ github.ref_name }}

      - name: Upload Test Manifest
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.ref_name }}
          path: test-result-manifest.json
          retention-days: 7